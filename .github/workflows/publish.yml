name: Publish image

# Publishing is deliberate, not automatic: a version tag or a manual run. That
# keeps `main` purely verified (CI builds the image on every PR without pushing)
# and means an accidental merge never ships an image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. edge). latest is only set from a v* tag."
        required: false
        default: "edge"

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fpl-buddy

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the registry credentials exist
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets first."
            echo "  gh secret set DOCKERHUB_USERNAME"
            echo "  gh secret set DOCKERHUB_TOKEN   # a Docker Hub access token, not your password"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=fpl-buddy
            org.opencontainers.image.description=A LangChain deep agent that proposes FPL captaincy and transfers, waits for you, and commits at the deadline.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 for cloud runtimes, arm64 so it runs natively on an Apple
          # Silicon machine. Drop arm64 to roughly halve the build time.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Smoke-test the published image
        run: |
          TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$TAG" python -c \
            "import fpl_buddy.main, fpl_buddy.api, fpl_buddy.agent.build; print('image ok')"
          docker run --rm "$TAG" fpl-buddy --help

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
