[project]
name = "fpl-buddy"
version = "0.2.1"
description = "A LangChain deep agent that proposes FPL captaincy + transfers, waits for you, and commits at the deadline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=4.3",
    "langgraph>=1.0.0",
    "httpx>=0.27",
    # Chrome TLS impersonation for the FPL password login. Premier League's bot
    # protection fingerprints the handshake, so a stock client cannot log in.
    "curl_cffi>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # FastAPI Form() support, for the approval buttons
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rapidfuzz>=3.9",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "discord.py>=2.4",
    "trafilatura>=1.12",  # article extraction, feed and sitemap parsing
    "lxml>=5.0",  # reading a page's own headline signals, where trafilatura guesses
    "pyyaml>=6.0",  # knowledge source config
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-data-tables>=12.5",
    "azure-communication-email>=1.0",
]
# Optional article-fetch backends. Neither is required: without them the
# harvester uses plain httpx, which is what it did before they existed.
firecrawl = ["firecrawl-py>=4.0"]
# Pulls playwright/patchright. The plain Fetcher needs no browser binaries;
# SCRAPLING_STEALTH=true additionally requires `scrapling install`.
scrapling = ["scrapling[fetchers]>=0.4"]
# Video transcripts. Small and pure-python; no browser, no API key.
youtube = ["youtube-transcript-api>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
fpl-buddy = "fpl_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_buddy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/fpl_buddy"]
warn_unused_ignores = true

# Third parties without stubs, plus the azure extra which isn't always installed.
[[tool.mypy.overrides]]
module = [
    "apscheduler.*", "azure.*", "deepagents.*", "itsdangerous.*",
    "firecrawl.*", "lxml.*", "scrapling.*", "trafilatura.*", "youtube_transcript_api.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
