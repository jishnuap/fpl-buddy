# Article sources for the daily harvest.
#
#   KNOWLEDGE_SOURCES_FILE=./sources.yaml
#   cp sources.example.yaml sources.yaml   # then edit
#
# This file is safe to commit: credentials are referenced by the NAME of an
# environment variable (`cookie_env`), never written here.
#
# Discovery is tried in order -- feeds, then sitemaps, then crawling `roots`.
# Prefer a feed where one exists: it is one request, it is a stable format, and
# it is the publisher telling you what is new rather than you guessing from HTML
# that changes on redesign.
#
# Every source below was checked live: the feed returns items, and robots.txt
# permits crawling. Two that look obvious and are not:
#
#   * r/FantasyPL has a working .rss feed, but reddit.com/robots.txt is
#     "User-agent: * / Disallow: /". The fetcher honours that and would skip
#     every request, so the source is omitted rather than left in to fail
#     quietly.
#   * fantasyyirma.com serves a feed whose newest item is from 2022. Dead site.

sources:
  - name: fantasy-football-scout
    enabled: true
    base_url: https://www.fantasyfootballscout.co.uk
    discovery:
      # The site-wide WordPress feed. Per-category feeds redirect to HTML here,
      # so the category pages below are crawled as roots instead.
      feeds:
        - https://www.fantasyfootballscout.co.uk/feed
      roots:
        - https://www.fantasyfootballscout.co.uk/articles
        - https://www.fantasyfootballscout.co.uk/team-news
        - https://www.fantasyfootballscout.co.uk/category/team-news
        - https://www.fantasyfootballscout.co.uk/fantasy-premier-league-set-piece-takers
      # Real posts live under /YYYY/MM/DD/. Everything else on a listing page is
      # navigation, tags, or an author archive.
      include_patterns:
        - '/20\d{2}/\d{2}/\d{2}/'
      exclude_patterns:
        - '/tag/'
        - '/author/'
        - '/page/'
      # 0 = fetch the roots above and take the article links off them. Raising
      # this follows non-article links too, which on a site this size means
      # hundreds of requests for very little; the page budget is the backstop.
      max_depth: 0
      max_pages_per_run: 8
      max_articles_per_run: 12
    tags: [tips, team-news]
    trust: high
    ttl_days: 21
    request_delay_seconds: 2.0
    # Fantasy Football Scout is freemium: articles cut off at "restricted to
    # Chief Scout Members" and the rest is never sent to a logged-out client, so
    # no crawler or headless browser can recover it. If you hold a membership,
    # put your session cookie header in this environment variable and full
    # articles will be stored instead of partial ones. Leave it unset and you
    # get the free portion, marked `access: partial`.
    #
    # Check FFS's terms before enabling: automated access to members-only
    # content may not be permitted even for members.
    cookie_env: FFS_COOKIE

  # ---------------------------------------------------------------------------
  # Free, FPL-specific. No paywall, so articles store as `access: full`.
  - name: all-about-fpl
    enabled: true
    base_url: https://allaboutfpl.com
    discovery:
      feeds:
        - https://allaboutfpl.com/feed
      include_patterns:
        - '/20\d{2}/\d{2}/'
      exclude_patterns:
        - '/tag/'
        - '/category/'
      max_articles_per_run: 6
    tags: [tips]
    trust: medium
    ttl_days: 21
    request_delay_seconds: 2.0

  # ---------------------------------------------------------------------------
  # YouTube channels. Discovery uses the per-channel upload feed; the content is
  # the video's caption track, read with youtube-transcript-api.
  #
  # ignore_robots is required and not a formality: YouTube's robots.txt
  # disallows both /feeds/videos.xml (this feed) and /api/ (the caption
  # endpoint). Leave it false and the source finds nothing. It is per-source and
  # off everywhere else, so the exception stays visible.
  #
  # `channel` takes an @handle, a /channel/UC... URL, or a bare UC... id. A
  # handle is resolved once per run from the channel page, which is not itself
  # disallowed.
  - name: lets-talk-fpl
    enabled: true
    kind: youtube
    channel: "@LetsTalkFPL"
    ignore_robots: true
    discovery:
      # Titles are matched here, not URLs -- a watch URL is an opaque id, so the
      # title is the only signal for skipping shorts and streams.
      exclude_patterns:
        - '(?i)#shorts'
        - '(?i)\blive\b'
      max_articles_per_run: 2
    # The feed carries no duration, so length is judged from the transcript: a
    # short comes in under a couple of thousand characters, a multi-hour stream
    # far over the ceiling. A half-hour video is around 28,000.
    min_transcript_chars: 1500
    max_transcript_chars: 80000
    tags: [video, tips]
    trust: medium
    ttl_days: 14
    request_delay_seconds: 2.0
